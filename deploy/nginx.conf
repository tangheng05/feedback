# /etc/nginx/sites-available/feedback
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/feedback
#   sudo ln -s /etc/nginx/sites-available/feedback /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace feedback.example.com with your subdomain before enabling.
#
# The two limit_req_zone and proxy_cache_path lines must live in the http{}
# block, not inside server{} — put them in /etc/nginx/nginx.conf, or in a file
# under /etc/nginx/conf.d/ (which is included from http{}).

# --- put these in http{} -----------------------------------------------------
# limit_req_zone $binary_remote_addr zone=fb_api:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=fb_gen:10m rate=60r/m;
# proxy_cache_path /var/cache/nginx/feedback levels=1:2 keys_zone=fb_qr:10m max_size=64m inactive=7d;
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name feedback.example.com;

    # certbot writes its challenge here and rewrites the rest of this block
    # into a 301 once a certificate is issued.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.example.com;

    # certbot --nginx fills these in
    ssl_certificate     /etc/letsencrypt/live/feedback.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Submissions are a few hundred bytes. Anything larger is not our traffic.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;

    access_log /var/log/nginx/feedback.access.log;
    error_log  /var/log/nginx/feedback.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OVERWRITE, not $proxy_add_x_forwarded_for. Appending would preserve a
        # client-supplied X-Forwarded-For, and a spoofed leading IP is a free
        # bypass of the per-IP rate limit on /api/feedback.
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # The form promises the customer that nothing identifies them. An access log
    # line records their IP and a second-resolution timestamp, and the feedback
    # row records the same timestamp — joining the two deanonymises every
    # submission without any cryptography at all. So: no access log here.
    location /api/ {
        access_log off;
        limit_req zone=fb_api burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # The webhook path is a hash of the secret rather than the secret itself,
    # but there is still no reason to write it to disk on every Telegram
    # delivery.
    location /tg/ {
        access_log off;

        # Optional hardening: only Telegram's published ranges may reach the
        # webhook. Uncomment if you are comfortable maintaining this list.
        # allow 149.154.160.0/20;
        # allow 91.108.4.0/22;
        # deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # QR rendering is CPU work on Node's single thread, and the slug is printed
    # on a poster on a public wall — so this endpoint is trivially discoverable.
    # Cache it at the edge and cap the rate.
    location ~ ^/(qr|poster)/ {
        limit_req zone=fb_gen burst=20;

        proxy_cache fb_qr;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
