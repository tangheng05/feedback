# /etc/nginx/sites-available/feedback
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/feedback
#   sudo ln -s /etc/nginx/sites-available/feedback /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace feedback.example.com with your subdomain before enabling.
# The lines below belong in http{} (nginx.conf or a conf.d/ file), not server{}.

# --- put these in http{} -----------------------------------------------------
# limit_req_zone $binary_remote_addr zone=fb_api:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=fb_gen:10m rate=60r/m;
# proxy_cache_path /var/cache/nginx/feedback levels=1:2 keys_zone=fb_qr:10m max_size=64m inactive=7d;
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name feedback.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.example.com;

    # certbot --nginx fills these in
    ssl_certificate     /etc/letsencrypt/live/feedback.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;

    access_log /var/log/nginx/feedback.access.log;
    error_log  /var/log/nginx/feedback.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Overwrite, not append: a client-supplied value would bypass the rate limit.
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # No access log: IP + timestamp could be joined to a feedback row.
    location /api/ {
        access_log off;
        limit_req zone=fb_api burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location /tg/ {
        access_log off;

        # Optional: allow only Telegram's published ranges.
        # allow 149.154.160.0/20;
        # allow 91.108.4.0/22;
        # deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Rendering is CPU-bound and the URLs are public, so cache and rate-limit.
    location ~ ^/(qr|poster)/ {
        limit_req zone=fb_gen burst=20;

        proxy_cache fb_qr;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
